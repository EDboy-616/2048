<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>2048</title>
<style>
  :root {
    --bg: #faf8ef;
    --board: #bbada0;
    --slot: rgba(238, 228, 218, .35);
    --ink: #776e65;
    --ink-soft: #a89f94;
    --btn: #8f7a66;
    --btn-ink: #f9f6f2;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Segoe UI", "Helvetica Neue", "Microsoft YaHei", system-ui, sans-serif;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 24px 16px 40px;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }
  .wrap { width: min(94vw, 460px); }

  .top { display: flex; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
  .title {
    margin: 0;
    font-size: clamp(44px, 13vw, 64px);
    line-height: 1;
    letter-spacing: -1px;
    font-weight: 800;
  }
  .scores { display: flex; gap: 8px; }
  .scorebox {
    position: relative;
    min-width: 74px;
    padding: 7px 10px 8px;
    background: var(--board);
    border-radius: 6px;
    text-align: center;
    color: var(--btn-ink);
  }
  .scorebox span { display: block; font-size: 11px; letter-spacing: 1px; opacity: .75; }
  .scorebox strong { display: block; font-size: 22px; line-height: 1.15; font-variant-numeric: tabular-nums; }
  .gain {
    position: absolute; left: 50%; top: 6px;
    transform: translateX(-50%);
    font-style: normal; font-size: 15px; font-weight: 700;
    color: rgba(249, 246, 242, .9);
    opacity: 0; pointer-events: none;
  }
  .gain.go { animation: rise 700ms ease-out forwards; }
  @keyframes rise {
    0% { opacity: 1; transform: translate(-50%, 0); }
    100% { opacity: 0; transform: translate(-50%, -34px); }
  }

  .sub { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px 12px; margin: 10px 0 14px; }
  .hint { margin: 0; flex: 1 1 168px; font-size: 13px; color: var(--ink-soft); line-height: 1.5; }
  .btns { display: flex; gap: 8px; flex: none; flex-wrap: wrap; justify-content: flex-end; margin-left: auto; }
  .btn {
    font: inherit; font-size: 14px; font-weight: 700;
    padding: 8px 14px;
    border: 0; border-radius: 6px;
    background: var(--btn); color: var(--btn-ink);
    cursor: pointer;
    transition: filter 120ms, transform 120ms;
  }
  .btn:hover { filter: brightness(1.08); }
  .btn:active { transform: translateY(1px); }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn.ghost { background: #c9b8a8; }
  .btn[aria-pressed="true"] { background: #edc22e; color: #4a4338; }

  .board {
    position: relative;
    width: 100%;
    aspect-ratio: 1;
    background: var(--board);
    border-radius: 8px;
    touch-action: none;
    user-select: none;
  }
  .cells {
    position: absolute; inset: 0;
    padding: var(--gap);
    display: grid;
    grid-template-columns: repeat(var(--n, 4), 1fr);
    grid-template-rows: repeat(var(--n, 4), 1fr);
    gap: var(--gap);
  }
  .cells i { background: var(--slot); border-radius: 6px; }

  .layer { position: absolute; inset: 0; }

  /* 触屏长按后出现的方向提示 */
  .hints { position: absolute; inset: 0; z-index: 60; pointer-events: none; }
  .hints[hidden] { display: none; }
  .hints i {
    position: absolute;
    width: 40px; height: 40px;
    display: flex; align-items: center; justify-content: center;
    font-style: normal; font-size: 20px; line-height: 1;
    color: var(--btn-ink);
    background: rgba(119, 110, 101, .55);
    border-radius: 50%;
    opacity: .55;
    transform: translate(-50%, -50%);
    transition: opacity 120ms, background 120ms, transform 120ms;
  }
  .hints [data-dir="up"]    { left: 50%; top: 15%; }
  .hints [data-dir="down"]  { left: 50%; top: 85%; }
  .hints [data-dir="left"]  { left: 15%; top: 50%; }
  .hints [data-dir="right"] { left: 85%; top: 50%; }
  .hints i.on {
    opacity: 1;
    background: #edc22e;
    color: #4a4338;
    transform: translate(-50%, -50%) scale(1.15);
  }

  .tile {
    position: absolute; left: 0; top: 0;
    width: var(--cell); height: var(--cell);
    transition: transform 120ms ease-in-out;
    will-change: transform;
  }
  .tile .face {
    position: absolute; inset: 0;
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800;
    font-size: calc(var(--cell) * .44);
    font-variant-numeric: tabular-nums;
    background: #eee4da; color: #776e65;
  }
  .tile.d4 .face { font-size: calc(var(--cell) * .36); }
  .tile.d5 .face { font-size: calc(var(--cell) * .29); }
  .tile.d6 .face { font-size: calc(var(--cell) * .24); }
  .tile.new .face { animation: appear 170ms ease 70ms backwards; }
  .tile.merged .face { animation: pop 190ms ease; }
  @keyframes appear { from { opacity: 0; transform: scale(.2); } }
  @keyframes pop { 50% { transform: scale(1.2); } }

  .v2  .face { background: #eee4da; }
  .v4  .face { background: #ede0c8; }
  .v8  .face { background: #f2b179; color: #f9f6f2; }
  .v16 .face { background: #f59563; color: #f9f6f2; }
  .v32 .face { background: #f67c5f; color: #f9f6f2; }
  .v64 .face { background: #f65e3b; color: #f9f6f2; }
  .v128 .face { background: #edcf72; color: #f9f6f2; }
  .v256 .face { background: #edcc61; color: #f9f6f2; }
  .v512 .face { background: #edc850; color: #f9f6f2; }
  .v1024 .face { background: #edc53f; color: #f9f6f2; }
  .v2048 .face { background: #edc22e; color: #f9f6f2; box-shadow: 0 0 0 2px rgba(243, 215, 116, .6); }
  .v4096 .face { background: #6f8f8b; color: #f9f6f2; }
  .v8192 .face { background: #4f7d78; color: #f9f6f2; box-shadow: 0 0 0 2px rgba(190, 230, 225, .55); }
  .vbig .face { background: #3c3a32; color: #f9f6f2; }

  .overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
    background: rgba(238, 228, 218, .72);
    border-radius: 8px;
    text-align: center;
    animation: fade 500ms ease 250ms backwards;
    z-index: 100;
  }
  .overlay[hidden] { display: none; }
  .overlay p { margin: 0; font-size: 34px; font-weight: 800; }
  .overlay .stats { font-size: 14px; font-weight: 600; opacity: .75; }
  .overlay.dead { background: rgba(238, 228, 218, .55); }
  @keyframes fade { from { opacity: 0; } }

  .foot { margin: 14px 0 0; font-size: 12px; color: var(--ink-soft); text-align: center; }
  kbd {
    font: inherit; font-size: 11px;
    padding: 1px 5px; border-radius: 4px;
    background: #e8e0d3; color: var(--ink);
    box-shadow: 0 1px 0 #cdc4b6;
  }
  .shake { animation: shake 260ms ease; }
  @keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }

  /* 暗色模式：跟随系统外观，方块经典配色两种模式下都可用 */
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #2a2724;
      --board: #443e38;
      --slot: rgba(238, 228, 218, .1);
      --ink: #d9d0c5;
      --ink-soft: #998f83;
    }
    .btn.ghost { background: #5c544b; }
    kbd { background: #3a352f; box-shadow: 0 1px 0 #1b1916; }
    .hints i { background: rgba(0, 0, 0, .5); }
    .overlay { background: rgba(42, 39, 36, .82); }
    .overlay.dead { background: rgba(24, 22, 19, .72); }
    .vbig .face { background: #d4cabf; color: #3c3a32; }
  }
</style>
</head>
<body>
<main class="wrap">
  <div class="top">
    <h1 class="title">2048</h1>
    <div class="scores">
      <div class="scorebox">
        <span>得分</span><strong id="score">0</strong><i class="gain" id="gain"></i>
      </div>
      <div class="scorebox"><span>最高</span><strong id="best">0</strong></div>
    </div>
  </div>

  <div class="sub">
    <p class="hint">相同数字相撞就合并，<br>目标是拼出 <b id="goal">2048</b>。</p>
    <div class="btns">
      <button class="btn ghost" id="undo">撤销</button>
      <select class="btn ghost" id="size" title="棋盘尺寸">
        <option value="3">3×3</option>
        <option value="4" selected>4×4</option>
        <option value="5">5×5</option>
      </select>
      <button class="btn ghost" id="sound" aria-pressed="false">🔇 音效</button>
      <button class="btn" id="new">新游戏</button>
    </div>
  </div>

  <div class="board" id="board">
    <div class="cells" id="cells"></div>
    <div class="layer" id="tiles"></div>
    <div class="hints" id="hints" hidden>
      <i data-dir="up">↑</i>
      <i data-dir="down">↓</i>
      <i data-dir="left">←</i>
      <i data-dir="right">→</i>
    </div>
    <div class="overlay" id="overlay" hidden>
      <p id="overlayText"></p>
      <p class="stats" id="overlayStats"></p>
      <div class="btns">
        <button class="btn" id="again">再来一局</button>
        <button class="btn ghost" id="keep" hidden>继续</button>
      </div>
    </div>
  </div>

  <p class="foot">方向键 / WASD 移动 · 触屏滑动（长按看方向）· <kbd>U</kbd> 撤销 · <kbd>R</kbd> 重开</p>
</main>

<script>
(() => {
  const GOALS = { 3: 512, 4: 2048, 5: 8192 };
  let N = 4;
  let GOAL = GOALS[N];
  const DIRS = { up: [-1, 0], down: [1, 0], left: [0, -1], right: [0, 1] };
  const KEYMAP = {
    ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
    w: 'up', s: 'down', a: 'left', d: 'right',
    W: 'up', S: 'down', A: 'left', D: 'right',
    k: 'up', j: 'down', h: 'left', l: 'right',
  };
  const MAX_HISTORY = 30;

  const $ = (id) => document.getElementById(id);
  const board = $('board'), cellsLayer = $('cells'), tilesLayer = $('tiles');
  const scoreEl = $('score'), bestEl = $('best'), gainEl = $('gain');
  const overlay = $('overlay'), overlayText = $('overlayText'), overlayStats = $('overlayStats'), keepBtn = $('keep');
  const undoBtn = $('undo'), sizeSel = $('size'), goalEl = $('goal');
  const hintsEl = $('hints'), hintArrows = [...hintsEl.querySelectorAll('i')];
  const bestKey = () => '2048-best-' + N;
  const saveKey = () => '2048-save-' + N;

  let gap = 0, cell = 0;
  let grid, tiles, ids, score, best, history, won, keepPlaying, finished;
  let moves = 0, merges = 0, startedAt = 0, elapsed = 0, running = false;

  /* ---------- 音效（Web Audio 现场合成，无音频文件） ---------- */
  const soundBtn = $('sound');
  let ac = null, soundOn = false;

  function audio() {
    if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') ac.resume();
    return ac;
  }

  function tone(freq, dur, type, vol, when) {
    if (!soundOn) return;
    const ctx = audio();
    const t0 = ctx.currentTime + (when || 0);
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, t0);
    gain.gain.setValueAtTime(vol || 0.05, t0);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(gain).connect(ctx.destination);
    osc.start(t0);
    osc.stop(t0 + dur + 0.02);
  }

  // 合并音：数字越大，音越高
  function sfxMerge(value) {
    const step = Math.log2(value || 2);          // 2→1, 4→2, 2048→11
    const freq = 220 * Math.pow(2, (step - 1) * 0.32);
    tone(Math.min(freq, 1600), 0.13, 'triangle', 0.055);
  }
  function sfxWin() {
    [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, 0.34, 'sine', 0.06, i * 0.11));
  }
  function sfxLose() {
    tone(196, 0.28, 'sawtooth', 0.045, 0);
    tone(146.83, 0.42, 'sawtooth', 0.045, 0.16);
  }
  function toggleSound() {
    soundOn = !soundOn;
    soundBtn.setAttribute('aria-pressed', String(soundOn));
    soundBtn.textContent = soundOn ? '🔊 音效' : '🔇 音效';
    if (soundOn) { audio(); tone(880, 0.1, 'sine', 0.04); }
  }

  /* ---------- 布局 ---------- */
  function layout() {
    const w = board.clientWidth;
    gap = Math.max(6, Math.round(w * 0.028));
    cell = (w - gap * (N + 1)) / N;
    board.style.setProperty('--gap', gap + 'px');
    board.style.setProperty('--cell', cell + 'px');
    board.style.setProperty('--n', N);
    sizeSel.value = String(N);
    if (cellsLayer.childElementCount !== N * N) {
      cellsLayer.textContent = '';
      for (let i = 0; i < N * N; i++) cellsLayer.appendChild(document.createElement('i'));
    }
    const els = [...tilesLayer.querySelectorAll('.tile')];
    for (const el of els) el.style.transition = 'none';
    for (const t of tiles) place(t);
    void tilesLayer.offsetHeight; // 提交新坐标，别让它们滑过去
    for (const el of els) el.style.transition = '';
  }

  const inside = (r, c) => r >= 0 && r < N && c >= 0 && c < N;
  const pos = (r, c) => [gap + c * (cell + gap), gap + r * (cell + gap)];

  /* ---------- 棋盘状态 ---------- */
  function emptyGrid() {
    return Array.from({ length: N }, () => Array.from({ length: N }, () => null));
  }

  function makeTile(value, r, c) {
    const t = { id: ++ids, value, r, c, el: null, merged: false, isNew: true, dying: false };
    const el = document.createElement('div');
    el.className = 'tile';
    const face = document.createElement('div');
    face.className = 'face';
    el.appendChild(face);
    t.el = el;
    paintFace(t);
    place(t);
    el.classList.add('new');
    tilesLayer.appendChild(el);
    return t;
  }

  function place(t) {
    const [x, y] = pos(t.r, t.c);
    t.el.style.transform = `translate(${x}px, ${y}px)`;
  }

  function paintFace(t) {
    const digits = String(t.value).length;
    t.el.className = 'tile v' + (t.value <= 8192 ? t.value : 'big') +
      (digits >= 6 ? ' d6' : digits >= 5 ? ' d5' : digits >= 4 ? ' d4' : '');
    t.el.firstChild.textContent = t.value;
  }

  function spawn() {
    const free = [];
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (!grid[r][c]) free.push([r, c]);
    if (!free.length) return null;
    const [r, c] = free[Math.floor(Math.random() * free.length)];
    const t = makeTile(Math.random() < 0.9 ? 2 : 4, r, c);
    tiles.push(t);
    grid[r][c] = t;
    return t;
  }

  function snapshot() {
    const cells = [];
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) cells.push(grid[r][c] ? grid[r][c].value : 0);
    return { cells, score };
  }

  /* ---------- 断点续玩（自动存档） ---------- */
  function saveGame() {
    if (finished) { localStorage.removeItem(saveKey()); return; }
    const snap = snapshot();
    snap.won = won; snap.keepPlaying = keepPlaying;
    snap.moves = moves; snap.merges = merges;
    snap.elapsed = elapsed + (running ? Date.now() - startedAt : 0);
    try { localStorage.setItem(saveKey(), JSON.stringify(snap)); } catch (e) { /* 存满就算了 */ }
  }

  function loadSaved() {
    try {
      const raw = localStorage.getItem(saveKey());
      if (!raw) return null;
      const snap = JSON.parse(raw);
      if (!Array.isArray(snap.cells) || snap.cells.length !== N * N) return null;
      return snap;
    } catch (e) { return null; }
  }

  function restore(snap) {
    tilesLayer.textContent = '';
    grid = emptyGrid();
    tiles = [];
    ids = 0;
    score = snap.score;
    // 撤销的历史快照没有统计字段，只有读档才有——别把它们清零
    if (snap.moves !== undefined) moves = snap.moves;
    if (snap.merges !== undefined) merges = snap.merges;
    if (snap.elapsed !== undefined) elapsed = snap.elapsed;
    startedAt = Date.now(); running = true;
    history = []; // 撤销历史不持久化，读档后从当前局面重新计
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      const v = snap.cells[r * N + c];
      if (v) { const t = makeTile(v, r, c); t.isNew = false; t.el.classList.remove('new'); tiles.push(t); grid[r][c] = t; }
    }
    let anyBig = false;
    for (const t of tiles) if (t.value >= GOAL) anyBig = true;
    won = snap.won !== undefined ? !!snap.won : anyBig;
    keepPlaying = !!snap.keepPlaying;
    finished = false;
    hideOverlay();
    syncHud();
    saveGame();
  }

  /* ---------- 移动 ---------- */
  function move(dir) {
    if (finished) return false;
    // 必须在改动 grid 之前取快照，否则撤销会回到“移动之后”的局面
    const before = snapshot();
    const [dr, dc] = DIRS[dir];
    for (const t of tiles) { t.merged = false; t.isNew = false; t.el.classList.remove('new', 'merged'); }
    for (const el of tilesLayer.querySelectorAll('.tile')) if (el.dataset.dying) el.remove();

    const dying = [];
    let moved = false, gained = 0, hitGoal = false, maxMerged = 0;

    const order = Array.from({ length: N }, (_, i) => i);
    const rows = dr === 1 ? order.slice().reverse() : order;
    const cols = dc === 1 ? order.slice().reverse() : order;

    for (const r of rows) for (const c of cols) {
      const t = grid[r][c];
      if (!t) continue;
      let nr = r, nc = c;
      while (inside(nr + dr, nc + dc) && !grid[nr + dr][nc + dc]) { nr += dr; nc += dc; }
      const tr = nr + dr, tc = nc + dc;
      const target = inside(tr, tc) ? grid[tr][tc] : null;

      if (target && target.value === t.value && !target.merged) {
        grid[r][c] = null;
        t.dying = true; t.r = target.r; t.c = target.c;
        dying.push(t);
        target.value *= 2;
        target.merged = true;
        gained += target.value;
        if (target.value > maxMerged) maxMerged = target.value;
        if (target.value >= GOAL && !won) { won = true; hitGoal = true; }
        moved = true;
      } else if (nr !== r || nc !== c) {
        grid[r][c] = null;
        grid[nr][nc] = t;
        t.r = nr; t.c = nc;
        moved = true;
      }
    }

    if (!moved) {
      board.classList.remove('shake');
      void board.offsetWidth;
      board.classList.add('shake');
      // 死局也可能出现在“没有有效移动”的时候，这里补一次判定
      if (!canMove()) {
        running = false; elapsed += Date.now() - startedAt;
        finished = true;
        sfxLose();
        localStorage.removeItem(saveKey());
        setTimeout(() => showOverlay('游戏结束', false), 200);
      }
      return false;
    }

    history.push(before);
    if (history.length > MAX_HISTORY) history.shift();
    score += gained;
    moves++;
    if (dying.length) merges += dying.length;
    if (gained) { showGain(gained); sfxMerge(maxMerged); }

    // 动画：滑到新位置
    for (const t of tiles) place(t);
    for (const t of dying) { t.el.dataset.dying = '1'; t.el.style.zIndex = 5; place(t); }
    tiles = tiles.filter((t) => !t.dying);
    for (const t of tiles) {
      paintFace(t);
      place(t);
      if (t.merged) { t.el.style.zIndex = 20; t.el.classList.add('merged'); }
    }
    setTimeout(() => { for (const t of dying) t.el.remove(); }, 140);

    spawn();
    syncHud();
    saveGame();

    if (hitGoal && !keepPlaying) {
      running = false; elapsed += Date.now() - startedAt;
      sfxWin();
      setTimeout(() => showOverlay('你赢了！', true), 260);
    } else if (!canMove()) {
      running = false; elapsed += Date.now() - startedAt;
      finished = true;
      sfxLose();
      localStorage.removeItem(saveKey());
      setTimeout(() => showOverlay('游戏结束', false), 320);
    }
    return true;
  }

  function canMove() {
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      const t = grid[r][c];
      if (!t) return true;
      if (c + 1 < N && grid[r][c + 1] && grid[r][c + 1].value === t.value) return true;
      if (r + 1 < N && grid[r + 1][c] && grid[r + 1][c].value === t.value) return true;
    }
    return false;
  }

  function undo() {
    if (!history.length) { undoBtn.classList.add('shake'); setTimeout(() => undoBtn.classList.remove('shake'), 300); return; }
    restore(history.pop());
  }

  /* ---------- HUD ---------- */
  function syncHud() {
    scoreEl.textContent = score;
    if (score > best) { best = score; localStorage.setItem(bestKey(), best); }
    bestEl.textContent = best;
    undoBtn.disabled = !history.length;
  }

  function showGain(n) {
    gainEl.textContent = '+' + n;
    gainEl.classList.remove('go');
    void gainEl.offsetWidth;
    gainEl.classList.add('go');
  }

  function fmtTime(ms) {
    const s = Math.floor(ms / 1000);
    const m = Math.floor(s / 60);
    return m ? m + ' 分 ' + (s % 60) + ' 秒' : s + ' 秒';
  }

  function statsText() {
    let maxV = 0;
    for (const t of tiles) if (t.value > maxV) maxV = t.value;
    return `步数 ${moves} · 用时 ${fmtTime(elapsed)} · 最大 ${maxV} · 合并 ${merges} 次`;
  }

  function showOverlay(text, win) {
    overlayText.textContent = text;
    overlayStats.textContent = statsText();
    overlay.classList.toggle('dead', !win);
    keepBtn.hidden = !win;
    overlay.hidden = false;
  }
  function hideOverlay() { overlay.hidden = true; }

  /* ---------- 开局 / 重开 ---------- */
  function reset() {
    tilesLayer.textContent = '';
    grid = emptyGrid();
    tiles = [];
    ids = 0;
    score = 0;
    history = [];
    moves = 0; merges = 0; elapsed = 0; startedAt = Date.now(); running = true;
    won = false; keepPlaying = false; finished = false;
    localStorage.removeItem(saveKey());
    hideOverlay();
    spawn(); spawn();
    syncHud();
  }

  /* ---------- 输入 ---------- */
  addEventListener('keydown', (e) => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const dir = KEYMAP[e.key];
    if (dir) { e.preventDefault(); move(dir); return; }
    if (e.key === 'u' || e.key === 'U' || e.key === 'z' || e.key === 'Z') { e.preventDefault(); undo(); }
    else if (e.key === 'r' || e.key === 'R') { e.preventDefault(); reset(); }
  }, { passive: false });

  /* 触屏：快速滑动直接走；按住不动 260ms 弹出方向提示，再滑向某边即选该方向 */
  const LONG_PRESS = 260;
  let touch = null, lpTimer = null, hintDir = null;

  function clearLongPress() { clearTimeout(lpTimer); lpTimer = null; }

  function showHints() {
    hintDir = null;
    for (const a of hintArrows) a.classList.remove('on');
    hintsEl.hidden = false;
    if (navigator.vibrate) navigator.vibrate(10);
  }

  function hideHints() {
    clearLongPress();
    hintsEl.hidden = true;
    hintDir = null;
    for (const a of hintArrows) a.classList.remove('on');
  }

  function setHintDir(dir) {
    if (dir === hintDir) return;
    hintDir = dir;
    for (const a of hintArrows) a.classList.toggle('on', a.dataset.dir === dir);
  }

  const dirOf = (dx, dy) =>
    Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');

  board.addEventListener('touchstart', (e) => {
    if (e.touches.length !== 1) { touch = null; hideHints(); return; }
    const p = e.changedTouches[0];
    touch = { x: p.clientX, y: p.clientY, hint: false };
    clearLongPress();
    lpTimer = setTimeout(() => {
      lpTimer = null;
      if (!touch || touch.moved) return;
      touch.hint = true;
      showHints();
    }, LONG_PRESS);
  }, { passive: true });

  board.addEventListener('touchmove', (e) => {
    if (!touch) return;
    const p = e.changedTouches[0];
    const dx = p.clientX - touch.x, dy = p.clientY - touch.y;
    const dist = Math.max(Math.abs(dx), Math.abs(dy));
    if (!touch.hint) {
      // 还没到长按时间就滑开了：当作普通滑动，取消长按
      if (dist > 12) { touch.moved = true; clearLongPress(); }
      return;
    }
    setHintDir(dist > 8 ? dirOf(dx, dy) : null);
  }, { passive: true });

  board.addEventListener('touchend', (e) => {
    clearLongPress();
    if (!touch) { hideHints(); return; }
    const p = e.changedTouches[0];
    const dx = p.clientX - touch.x, dy = p.clientY - touch.y;
    const wasHint = touch.hint, dir = hintDir;
    touch = null;
    hideHints();
    if (wasHint) { if (dir) move(dir); return; }         // 长按模式：松手时按选中的方向走
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
    move(dirOf(dx, dy));
  }, { passive: true });

  board.addEventListener('touchcancel', () => { touch = null; hideHints(); }, { passive: true });

  $('new').addEventListener('click', reset);
  sizeSel.addEventListener('change', () => {
    N = Number(sizeSel.value);
    GOAL = GOALS[N];
    goalEl.textContent = GOAL;
    best = Number(localStorage.getItem(bestKey()) || 0);
    const s = loadSaved();
    if (s) restore(s); else reset();
    layout();
  });
  $('again').addEventListener('click', reset);
  undoBtn.addEventListener('click', undo);
  soundBtn.addEventListener('click', toggleSound);
  keepBtn.addEventListener('click', () => {
    keepPlaying = true;
    running = true; startedAt = Date.now(); // 恢复计时
    hideOverlay();
  });

  new ResizeObserver(layout).observe(board);

  goalEl.textContent = GOAL;
  best = Number(localStorage.getItem(bestKey()) || 0);
  const saved = loadSaved();
  if (saved) restore(saved); else reset();
  layout();

  // 供自动化测试驱动
  window.__game = {
    values: () => grid.map((row) => row.map((t) => (t ? t.value : 0))),
    score: () => score,
    canMove,
    move,
    undo,
    reset,
    setGrid(rows) {
      tilesLayer.textContent = '';
      grid = emptyGrid(); tiles = []; ids = 0;
      for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
        const v = rows[r][c];
        if (v) { const t = makeTile(v, r, c); t.isNew = false; t.el.classList.remove('new'); tiles.push(t); grid[r][c] = t; }
      }
      score = 0;
      won = false; keepPlaying = false; finished = false; hideOverlay();
      history = [];
      syncHud();
    },
  };
})();
</script>
</body>
</html>
